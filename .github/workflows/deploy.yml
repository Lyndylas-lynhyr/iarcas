name: Deploy to GitHub Pages
on:
 push:
   branches:
     - main
jobs:
 deploy:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout code
       uses: actions/checkout@v2
     - name: Build static assets
       run: |
         npm install
         npm run build
     - name: Deploy to GitHub Pages
       uses: actions/upload-pages@v1
       with:
         github-token: ${{ secrets.GITHUB_TOKEN }}
         build-directory: ./build
